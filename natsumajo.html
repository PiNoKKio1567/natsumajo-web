<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
<title>夏の魔女 — 与两位魔女的田园生活</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100%; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  /* The game renders a fixed 1280x720 frame; the stage letterboxes it instead of stretching
     it, so a 16:10 or ultrawide window keeps the art's proportions. */
  #canvas { display: block; outline: none; touch-action: none; background: #000; box-shadow: 0 0 60px rgba(0,0,0,.9); }
  #boot {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(circle at 50% 40%, #1d2436 0%, #07090d 72%);
    color: #e8ecf5; font-family: "Microsoft YaHei", "Noto Sans", system-ui, sans-serif;
    transition: opacity .6s ease; z-index: 10;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: .22em; color: #f2e6c8; }
  #boot .sub { font-size: 12px; color: #7d8699; letter-spacing: .18em; }
  #start {
    margin-top: 10px; padding: 12px 40px; font-size: 15px; letter-spacing: .2em;
    font-family: inherit; color: #1a1408; cursor: pointer;
    background: linear-gradient(180deg, #f0d9a0, #c9a86a); border: 1px solid #e8d5a8;
    border-radius: 999px; box-shadow: 0 6px 20px rgba(240,217,160,.25);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  #start:hover { transform: translateY(-1px); box-shadow: 0 10px 26px rgba(240,217,160,.35); }
  #start:active { transform: translateY(1px); }
  #start .hint { display: block; margin-top: 6px; font-size: 11px; letter-spacing: .1em; color: #6a5a34; }
  #load { display: none; flex-direction: column; align-items: center; gap: 14px; }
  #load.on { display: flex; }
  #bar-wrap { width: min(440px, 70vw); height: 4px; background: #1e2536; border-radius: 99px; overflow: hidden; }
  #bar { height: 100%; width: 0%; background: linear-gradient(90deg, #b99a5e, #f0d9a0); transition: width .2s ease; }
  #pct { font-size: 12px; color: #8b94a6; font-variant-numeric: tabular-nums; min-height: 16px; letter-spacing: .05em; }
  #gate { display: none; flex-direction: column; align-items: center; gap: 10px; }
  #gate input {
    width: 240px; padding: 9px 12px; border-radius: 8px; border: 1px solid #48536e;
    background: #11151f; color: #e8ecf5; font-size: 15px; text-align: center;
  }
  #gate button {
    padding: 8px 22px; border-radius: 8px; border: 1px solid #5b6a8d;
    background: #1b2233; color: #dfe6f4; font-size: 14px; cursor: pointer;
  }
  #gate .err { min-height: 18px; color: #ff9d9d; font-size: 13px; }
  #notice {
    display: none; max-width: min(640px, 82vw); margin-top: 8px; padding: 14px 18px;
    background: #2a1c22; border: 1px solid #7d3f4c; border-radius: 10px;
    color: #f0c9d1; font-size: 13px; line-height: 1.7; white-space: pre-wrap; text-align: left;
  }
</style>
<script>
/* Two browser-side rules can leave this game silent while everything still looks healthy:
   an AudioContext created before any interaction stays suspended, and this Godot build rewires
   its audio buses in a way that can drop the last connection to the speakers — the graph keeps
   carrying sound, so a probe inside the page reads a normal level while the room stays quiet.
   Both are handled here: every context is recorded so a later click can resume it, and any node
   the engine ever wired to the destination is re-checked and re-attached if it goes missing. */
(function () {
  const Native = window.AudioContext || window.webkitAudioContext;
  if (!Native) return;
  const contexts = [];
  window.__audioContexts = contexts;
  const Wrapped = function (...args) {
    const ctx = new Native(...args);
    contexts.push(ctx);
    return ctx;
  };
  Wrapped.prototype = Native.prototype;
  window.AudioContext = Wrapped;
  window.webkitAudioContext = Wrapped;

  const resumeAll = () => contexts.forEach((c) => {
    if (c.state === 'suspended') c.resume().catch(() => {});
  });
  ['pointerdown', 'mousedown', 'keydown', 'touchstart'].forEach((ev) =>
    window.addEventListener(ev, resumeAll, { capture: true, passive: true }));

  // Destination bookkeeping: count the edges pointing at the speakers, so a dropped one is
  // restored exactly once instead of piling up parallel connections (which would play louder
  // than the mix intends).
  const wired = new Set();
  const nativeConnect = AudioNode.prototype.connect;
  const nativeDisconnect = AudioNode.prototype.disconnect;
  AudioNode.prototype.connect = function (dst, ...rest) {
    const out = nativeConnect.call(this, dst, ...rest);
    if (dst instanceof AudioDestinationNode) {
      this.__destEdges = (this.__destEdges || 0) + 1;
      wired.add(this);
    }
    return out;
  };
  AudioNode.prototype.disconnect = function (...args) {
    const out = nativeDisconnect.apply(this, args);
    if (this.__destEdges && (args.length === 0 || args[0] === this.context.destination)) {
      this.__destEdges = 0;
    }
    return out;
  };
  setInterval(() => {
    wired.forEach((node) => {
      if (!node.__destEdges) {
        try { nativeConnect.call(node, node.context.destination); node.__destEdges = 1; } catch (e) {}
      }
    });
  }, 250);
})();
</script>
</head>
<body>
<div id="stage"><canvas id="canvas" width="1280" height="720" tabindex="0"></canvas></div>

<div id="boot">
  <h1>夏の魔女</h1>
  <div class="sub">与两位魔女的田园生活</div>
  <button id="start">开始<span class="hint">点这里之后才会有声音</span></button>
  <div id="gate">
    <input id="code" type="password" placeholder="口令" autocomplete="off">
    <button id="unlock">进入</button>
    <div class="err" id="gateErr"></div>
  </div>
  <div id="load">
    <div id="bar-wrap"><div id="bar"></div></div>
    <div id="pct">初始化…</div>
  </div>
  <div id="notice"></div>
</div>

<script src="godot.js"></script>
<script>
const GODOT_THREADS_ENABLED = true;
const GODOT_CONFIG = {
  "args": [],
  "canvasResizePolicy": 0,
  "executable": "godot",
  "mainPack": "game.pck",
  "fileSizes": { "godot.wasm": 37003942, "game.pck": 553160140 },
  "focusCanvas": true,
  "serviceWorker": ""
};

const canvasEl = document.getElementById('canvas');
const bootEl = document.getElementById('boot');
const startEl = document.getElementById('start');
const loadEl = document.getElementById('load');
const barEl = document.getElementById('bar');
const pctEl = document.getElementById('pct');
const noticeEl = document.getElementById('notice');

// Left empty the page is open to anyone holding the URL. Set it to a phrase and the panel asks
// for that phrase once per browser first — enough to keep a public link from being casually shared.
const ACCESS_CODE = '';

function applyGate() {
  if (!ACCESS_CODE || localStorage.getItem('natsumajo.pass') === ACCESS_CODE) return;
  const gateEl = document.getElementById('gate');
  const codeEl = document.getElementById('code');
  const errEl = document.getElementById('gateErr');
  gateEl.style.display = 'flex';
  startEl.style.display = 'none';
  const tryUnlock = () => {
    if (codeEl.value === ACCESS_CODE) {
      localStorage.setItem('natsumajo.pass', codeEl.value);
      gateEl.style.display = 'none';
      startEl.style.display = '';
    } else {
      errEl.textContent = '口令不对';
    }
  };
  document.getElementById('unlock').addEventListener('click', tryUnlock);
  codeEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });
}

function fit() {
  const ar = 1280 / 720;
  let w = window.innerWidth;
  let h = w / ar;
  if (h > window.innerHeight) {
    h = window.innerHeight;
    w = h * ar;
  }
  canvasEl.style.width = Math.floor(w) + 'px';
  canvasEl.style.height = Math.floor(h) + 'px';
}
fit();
window.addEventListener('resize', fit);
applyGate();

function fail(msg) {
  console.error(msg);
  noticeEl.style.display = 'block';
  noticeEl.textContent = String(msg);
  pctEl.textContent = '启动失败';
}

// Godot on the web maps user:// onto /userfs/godot/app_userdata/<project name>, so the
// bundled files have to land there or the game never sees them.
const USER_DIR = '/userfs/godot/app_userdata/なつまじょ';
// Two separate flags on purpose: the save is imported once and must never be overwritten again
// (that would erase actual progress), while the audio settings may need re-tuning later.
const IMPORT_SAVE = 'natsumajo.portable.v4';
const IMPORT_AUDIO = 'natsumajo.audio.v1';


// --- keep the imported saves alive -------------------------------------------------------
// The engine only flushes /userfs to IndexedDB when it closes a file it wrote itself, so a save
// that arrives through preloadFile/copyToFS lives for one session and is gone on the next visit.
// Writing the same bytes into the IDBFS store ourselves makes them stick, and their presence (not
// just a localStorage flag) decides whether an import is still needed — a failed import then heals
// on the following visit instead of leaving an empty game.
const IDB_DB = '/userfs';
const IDB_STORE = 'FILE_DATA';
const IDB_FILE_MODE = 33206; // 0o100666, what IDBFS writes for save files
const IDB_DIR_MODE = 16893;  // 0o40755

function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_DB);
    req.onupgradeneeded = () => {
      if (!req.result.objectStoreNames.contains(IDB_STORE)) req.result.createObjectStore(IDB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function idbGetPath(db, path) {
  return new Promise((resolve) => {
    const g = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(path);
    g.onsuccess = () => resolve(g.result || null);
    g.onerror = () => resolve(null);
  });
}

async function idbHas(path) {
  try { return !!(await idbGetPath(await idbOpen(), path)); } catch (e) { return false; }
}

async function idbPut(db, path, value) {
  await new Promise((resolve) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(value, path);
    tx.oncomplete = resolve;
    tx.onerror = resolve;
    tx.onabort = resolve;
  });
}

async function idbKeep(path, bytes) {
  let db;
  try { db = await idbOpen(); } catch (e) { return; }
  const parts = path.split('/').filter(Boolean);
  let dir = '';
  for (let i = 0; i < parts.length - 1; i++) {
    dir += '/' + parts[i];
    if (!(await idbGetPath(db, dir))) await idbPut(db, dir, { mode: IDB_DIR_MODE, timestamp: new Date() });
  }
  if (await idbGetPath(db, path)) return; // never clobber newer progress
  const copy = new Int8Array(bytes.length);
  copy.set(bytes);
  await idbPut(db, path, { mode: IDB_FILE_MODE, timestamp: new Date(), contents: copy });
}

const IMPORT_GROUPS = [
  { flag: IMPORT_SAVE, files: [{ src: 'portable/save_00.json', dest: 'saves/save_00.json' }] },
  { flag: IMPORT_AUDIO, files: [{ src: 'portable/config.json', dest: 'config.json' }] },
];

async function importPortableSave(engine) {
  let imported = 0;
  for (const group of IMPORT_GROUPS) {
    const first = USER_DIR + '/' + group.files[0].dest;
    if (localStorage.getItem(group.flag) && await idbHas(first)) continue;
    for (const item of group.files) {
      const res = await fetch(item.src);
      if (!res.ok) throw new Error(item.src + ': HTTP ' + res.status);
      const bytes = new Uint8Array(await res.arrayBuffer());
      const dest = USER_DIR + '/' + item.dest;
      await engine.preloadFile(bytes.buffer, dest);
      await idbKeep(dest, bytes);
    }
    localStorage.setItem(group.flag, '1');
    imported++;
  }
  return imported;
}
function boot() {
  startEl.remove();
  loadEl.classList.add('on');

  const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
  if (missing.length !== 0) {
    fail('浏览器缺少运行所需的功能：\n' + missing.join('\n') +
         '\n\n请用 Chrome / Edge 打开，并通过 http:// 地址访问（不要直接双击 html 文件）。');
    return;
  }

  const engine = new Engine(GODOT_CONFIG);
  window.__engine = engine;
  // A click here means the page has been interacted with, so the engine's audio context
  // starts running instead of suspended.
  (window.__audioContexts || []).forEach((c) => { if (c.state === 'suspended') c.resume().catch(() => {}); });

  pctEl.textContent = '加载引擎…';
  const showProgress = (got, total) => {
    if (got > 0 && total > 0) {
      barEl.style.width = (got / total * 100).toFixed(1) + '%';
      pctEl.textContent = (got / 1048576).toFixed(0) + ' / ' + (total / 1048576).toFixed(0) + ' MB';
    }
  };
  const sizing = { onProgress: showProgress };

  engine.init('godot')
    .then(() => importPortableSave(engine))
    .then(async () => {
      pctEl.textContent = '读取游戏数据…';
      let pack = null;
      try {
        pack = await fetchPack(showProgress);
      } catch (e) {
        console.warn('并行读取失败，改走单连接：', e);
      }
      if (pack) {
        // Hand the pack over as memory, then make sure the loader does not download it again.
        await engine.preloadFile(pack.buffer, PACK_URL);
        const nativePreload = engine.preloadFile.bind(engine);
        engine.preloadFile = (file, path) =>
          (file === PACK_URL ? Promise.resolve() : nativePreload(file, path));
      }
      return engine.startGame(sizing);
    })
    .then(() => {
      barEl.style.width = '100%';
      pctEl.textContent = '完成';
      setTimeout(() => bootEl.classList.add('gone'), 350);
      canvasEl.focus();
      (window.__audioContexts || []).forEach((c) => { if (c.state === 'suspended') c.resume().catch(() => {}); });
    })
    .catch(fail);
}

startEl.addEventListener('click', boot);
</script>
</body>
</html>
