# Render static site: a small portal plus two Godot web games.
# The game packs are 553 MB and 258 MB — far past what a Git repository accepts — so they live as
# GitHub Release assets and are pulled in during the build; the repo itself stays small and clonable.
services:
  - type: web
    name: natsumajo
    runtime: static
    buildCommand: >
      (curl -fL -o game.pck "$PCK_URL" || wget -qO game.pck "$PCK_URL")
      && (curl -fL -o fushidara/game.pck "$PCK_URL_FUSHIDARA" || wget -qO fushidara/game.pck "$PCK_URL_FUSHIDARA")
      && ls -l game.pck fushidara/game.pck
    staticPublishPath: .
    envVars:
      - key: PCK_URL
        sync: false
      - key: PCK_URL_FUSHIDARA
        sync: false
    headers:
      # Godot's threaded web build needs a cross-origin isolated page for SharedArrayBuffer.
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: require-corp
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-origin
      # The packs never change once published; let the browser keep them.
      - path: /game.pck
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /fushidara/game.pck
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /godot.wasm
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /fushidara/godot.wasm
        name: Cache-Control
        value: public, max-age=31536000, immutable